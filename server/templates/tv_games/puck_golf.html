<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>⛳ PUCK GOLF - Game 54</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { background: linear-gradient(to bottom, #87CEEB, #228B22); font-family: Arial, sans-serif; color: #fff; overflow: hidden; }
        #gameCanvas { display: block; margin: 0 auto; }
        #hud { position: absolute; top: 20px; left: 0; right: 0; display: flex; justify-content: space-around; font-size: 28px; text-shadow: 2px 2px #000; z-index: 10; }
        #power { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 300px; height: 40px; background: #333; border: 3px solid #fff; }
        #powerBar { height: 100%; background: linear-gradient(to right, #0f0, #ff0, #f00); width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>
    <div id="hud">
        <div>HOLE: <span id="hole">1</span>/9</div>
        <div>STROKES: <span id="strokes">0</span></div>
        <div>SCORE: <span id="score">1000</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="power"><div id="powerBar"></div></div>

    <!-- Sprint 1D: State validation -->
    <script src="/static/js/game_state_validator.js"></script>
    <script>
        const PUCK_ID = {{ puck_id }};
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameState = null;

        // Sprint 1D: Responsive canvas scaling for TV displays
        let CANVAS_WIDTH = window.innerWidth;
        let CANVAS_HEIGHT = window.innerHeight;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Sprint 1D: Validator for single-player game
        const stateValidator = SinglePlayerValidator;

        socket.on('connect', () => {
            socket.emit('join_game_room', { puck_id: PUCK_ID });
            socket.emit('request_game_state', { puck_id: PUCK_ID });
        });

        socket.on('game_state_update', (state) => {
            // Sprint 1D: Validate state
            if (!stateValidator.validate(state)) {
                console.error('Invalid game state received, skipping update');
                return;
            }

            gameState = state;
            document.getElementById('hole').textContent = state.hole_number || 1;
            document.getElementById('strokes').textContent = state.strokes || 0;
            document.getElementById('score').textContent = state.score;
            document.getElementById('powerBar').style.width = state.power + '%';
        });

        function render() {
            if (!gameState) return;

            // Background
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Hole
            const holeX = (gameState.hole_x / 100) * CANVAS_WIDTH;
            const holeY = (gameState.hole_y / 100) * CANVAS_HEIGHT;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(holeX, holeY, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(holeX - 2, holeY - 40, 4, 40);

            // Ball
            const ballX = (gameState.ball_x / 100) * CANVAS_WIDTH;
            const ballY = (gameState.ball_y / 100) * CANVAS_HEIGHT;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ballX, ballY, 12, 0, Math.PI * 2);
            ctx.fill();

            // Aim line (if charging)
            if (gameState.charging) {
                const angle = (gameState.aim_angle - 90) * Math.PI / 180;
                const endX = ballX + Math.cos(angle) * 100;
                const endY = ballY + Math.sin(angle) * 100;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 5]);
                ctx.beginPath();
                ctx.moveTo(ballX, ballY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            requestAnimationFrame(render);
        }

        render();
    

        // Sprint 1D: Handle window resize for responsive scaling
        window.addEventListener('resize', () => {
            CANVAS_WIDTH = window.innerWidth;
            CANVAS_HEIGHT = window.innerHeight;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
        });
    </script>
    <!-- Sprint 0.5: Connection Health Monitoring -->
    {% include 'tv_games/_debug_panel.html' %}
</body>
</html>
