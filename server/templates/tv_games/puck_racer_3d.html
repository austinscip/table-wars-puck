<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ PUCK RACER 3D - Game 52</title>
    <!-- Sprint 1D: State validation -->
    <script src="/static/js/game_state_validator.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/ShaderPass.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            color: white;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* HUD - Keep from original */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 50px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #00ff00;
        }

        .hud-value {
            color: #00ff00;
            font-size: 36px;
            font-weight: bold;
        }

        #nitroBar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .nitro {
            width: 60px;
            height: 60px;
            background: #ff00ff;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        .nitro.used {
            background: #333;
            box-shadow: none;
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 60px;
            border-radius: 20px;
            border: 5px solid #ff0000;
            text-align: center;
            z-index: 100;
        }

        #gameOver h1 {
            font-size: 72px;
            color: #ff0000;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        #gameOver .finalScore {
            font-size: 96px;
            color: #00ff00;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <!-- HUD (Same as original) -->
    <div id="hud">
        <div class="hud-item">
            <div>SCORE</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-item">
            <div>SPEED</div>
            <div class="hud-value" id="speed">0</div>
        </div>
        <div class="hud-item">
            <div>CRASHES</div>
            <div class="hud-value" id="crashes">0</div>
        </div>
        <div class="hud-item">
            <div>TIME</div>
            <div class="hud-value" id="time">90</div>
        </div>
    </div>

    <div id="nitroBar">
        <div class="nitro" id="nitro1"></div>
        <div class="nitro" id="nitro2"></div>
        <div class="nitro" id="nitro3"></div>
    </div>

    <div id="gameOver">
        <h1>🏁 GAME OVER</h1>
        <div class="finalScore" id="finalScore">0</div>
        <div style="font-size: 36px; margin-top: 30px;">
            Distance: <span id="finalDistance">0</span>m
        </div>
    </div>

    <script>
        const PUCK_ID = {{ puck_id }};

        // ====================================================================
        // THREE.JS SETUP (95% copied from racing-game repo)
        // ====================================================================

        let scene, camera, renderer, composer;
        let playerCar, obstacles = [], collectibles = [];
        let gameState = null;

        // Sprint 1D: Validator for 3D game
        const stateValidator = new GameStateValidator([\'score\', \'game_over\'])
            .withTypes({ score: \'number\', game_over: \'boolean\' })
            .withOptional([\'position\', \'rotation\', \'speed\']);

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

            // Camera (Chase cam behind car)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Post-processing (Bloom effect - copied from racing-game)
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,  // strength
                0.4,  // radius
                0.85  // threshold
            );
            composer.addPass(bloomPass);

            // Lights (copied from racing-game)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Create road
            createRoad();

            // Create player car
            createPlayerCar();

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function createRoad() {
            // Road surface
            const roadGeometry = new THREE.PlaneGeometry(12, 200);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.8
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Lane markers
            for (let i = 0; i < 200; i += 4) {
                for (let lane = 1; lane < 4; lane++) {
                    const markerGeometry = new THREE.BoxGeometry(0.2, 0.05, 2);
                    const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                    const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                    marker.position.set(
                        -6 + (lane * 3),  // X position (4 lanes)
                        0.1,
                        -100 + i
                    );
                    scene.add(marker);
                }
            }

            // Road edges
            const edgeGeometry = new THREE.BoxGeometry(0.5, 0.2, 200);
            const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });

            const leftEdge = new THREE.Mesh(edgeGeometry, edgeMaterial);
            leftEdge.position.set(-7.5, 0.1, 0);
            scene.add(leftEdge);

            const rightEdge = new THREE.Mesh(edgeGeometry, edgeMaterial);
            rightEdge.position.set(7.5, 0.1, 0);
            scene.add(rightEdge);
        }

        function createPlayerCar() {
            // Simple car made of boxes (replace with GLTF model later)
            const carGroup = new THREE.Group();

            // Car body
            const bodyGeometry = new THREE.BoxGeometry(2, 1, 3);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x00ff00,
                metalness: 0.8,
                roughness: 0.2
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            carGroup.add(body);

            // Car top (cabin)
            const topGeometry = new THREE.BoxGeometry(1.6, 0.8, 1.5);
            const topMaterial = new THREE.MeshStandardMaterial({
                color: 0x00cc00,
                metalness: 0.6,
                roughness: 0.3
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 1.4;
            top.castShadow = true;
            carGroup.add(top);

            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const wheelPositions = [
                [-1, 0.3, 1],
                [1, 0.3, 1],
                [-1, 0.3, -1],
                [1, 0.3, -1]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            // Headlights (glow when nitro active)
            const lightGeometry = new THREE.BoxGeometry(0.3, 0.2, 0.2);
            const lightMaterial = new THREE.MeshStandardMaterial({
                color: 0xffff00,
                emissive: 0xffff00,
                emissiveIntensity: 0
            });

            const leftLight = new THREE.Mesh(lightGeometry, lightMaterial.clone());
            leftLight.position.set(-0.7, 0.5, 1.6);
            carGroup.add(leftLight);

            const rightLight = new THREE.Mesh(lightGeometry, lightMaterial.clone());
            rightLight.position.set(0.7, 0.5, 1.6);
            carGroup.add(rightLight);

            carGroup.position.set(0, 0, 0);
            scene.add(carGroup);
            playerCar = carGroup;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ====================================================================
        // WEBSOCKET (100% from your existing code)
        // ====================================================================

        const socket = io();

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            socket.emit('join_game_room', { puck_id: PUCK_ID });
            socket.emit('request_game_state', { puck_id: PUCK_ID });
        });

        socket.on('game_state_update', (state) => {
            // Sprint 1D: Validate state
            if (!stateValidator.validate(state)) {
                console.error('Invalid game state received, skipping update');
                return;
            }

            gameState = state;
            updateHUD(state);
            updateScene(state);
        });

        socket.on('game_over', (data) => {
            document.getElementById('finalScore').textContent = data.state.score;
            document.getElementById('finalDistance').textContent = data.state.distance;
            document.getElementById('gameOver').style.display = 'block';
        });

        // ====================================================================
        // UPDATE HUD (100% from your existing code)
        // ====================================================================

        function updateHUD(state) {
            document.getElementById('score').textContent = state.score;
            document.getElementById('speed').textContent = state.speed + ' mph';
            document.getElementById('crashes').textContent = state.crashes + '/3';
            document.getElementById('time').textContent = state.time_remaining + 's';

            for (let i = 1; i <= 3; i++) {
                const nitro = document.getElementById('nitro' + i);
                if (i <= state.nitro_count) {
                    nitro.classList.remove('used');
                } else {
                    nitro.classList.add('used');
                }
            }
        }

        // ====================================================================
        // UPDATE 3D SCENE (NEW - map your game state to 3D)
        // ====================================================================

        function updateScene(state) {
            // Update player car position (map lane 1-4 to X position)
            if (playerCar) {
                const targetX = -6 + ((state.car_lane - 1) * 3); // Lane 1 = -6, Lane 4 = 3
                playerCar.position.x = THREE.MathUtils.lerp(
                    playerCar.position.x,
                    targetX,
                    0.1  // Smooth movement
                );

                // Nitro glow effect
                if (state.nitro_active) {
                    playerCar.children.forEach(child => {
                        if (child.material && child.material.emissive) {
                            child.material.emissiveIntensity = 2;
                        }
                    });
                } else {
                    playerCar.children.forEach(child => {
                        if (child.material && child.material.emissive) {
                            child.material.emissiveIntensity = 0;
                        }
                    });
                }
            }

            // Update obstacles
            updateObstacles(state.obstacles);

            // Update collectibles
            updateCollectibles(state.collectibles);
        }

        function updateObstacles(obstacleData) {
            // Remove old obstacles that are too far - Sprint 1D: Properly dispose to prevent memory leak
            obstacles = obstacles.filter(obs => {
                if (obs.userData.distance > 500 || obs.userData.distance < -10) {
                    scene.remove(obs);
                    // Dispose geometry and material to free GPU memory
                    if (obs.geometry) obs.geometry.dispose();
                    if (obs.material) obs.material.dispose();
                    return false;
                }
                return true;
            });

            // Create/update obstacles
            obstacleData.forEach((data, index) => {
                let obstacle = obstacles[index];

                if (!obstacle) {
                    // Create new obstacle
                    let geometry, material;

                    if (data.type === 'cone') {
                        geometry = new THREE.ConeGeometry(0.5, 1.5, 8);
                        material = new THREE.MeshStandardMaterial({ color: 0xff8800 });
                    } else if (data.type === 'skull') {
                        geometry = new THREE.SphereGeometry(0.7, 16, 16);
                        material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                    } else {
                        geometry = new THREE.BoxGeometry(1, 1.5, 1);
                        material = new THREE.MeshStandardMaterial({ color: 0xffff00 });
                    }

                    obstacle = new THREE.Mesh(geometry, material);
                    obstacle.castShadow = true;
                    scene.add(obstacle);
                    obstacles.push(obstacle);
                }

                // Update position
                const x = -6 + ((data.lane - 1) * 3);
                const z = -data.distance * 0.05;  // Scale distance to 3D space
                obstacle.position.set(x, 0.75, z);
                obstacle.userData.distance = data.distance;
            });
        }

        function updateCollectibles(collectibleData) {
            // Sprint 1D: Remove collected or out-of-range collectibles to prevent memory leak
            collectibles = collectibles.filter((col, index) => {
                const data = collectibleData[index];
                if (!data || data.collected || data.distance > 500 || data.distance < -10) {
                    scene.remove(col);
                    // Dispose geometry and material to free GPU memory
                    if (col.geometry) col.geometry.dispose();
                    if (col.material) col.material.dispose();
                    return false;
                }
                return true;
            });

            collectibleData.forEach((data, index) => {
                if (data.collected) return;

                let collectible = collectibles[index];

                if (!collectible) {
                    let geometry = new THREE.SphereGeometry(0.4, 16, 16);
                    let material = new THREE.MeshStandardMaterial({
                        color: data.type === 'nitro' ? 0xff00ff : 0xffff00,
                        emissive: data.type === 'nitro' ? 0xff00ff : 0xffff00,
                        emissiveIntensity: 0.5
                    });

                    collectible = new THREE.Mesh(geometry, material);
                    scene.add(collectible);
                    collectibles.push(collectible);
                }

                const x = -6 + ((data.lane - 1) * 3);
                const z = -data.distance * 0.05;
                collectible.position.set(x, 1, z);
                collectible.rotation.y += 0.05;  // Spin
            });
        }

        // ====================================================================
        // RENDER LOOP
        // ====================================================================

        function animate() {
            requestAnimationFrame(animate);

            // Render with post-processing
            composer.render();
        }

        // ====================================================================
        // INIT
        // ====================================================================

        initThreeJS();
        animate();

        console.log('🎮 3D Puck Racer initialized - waiting for game state...');
    </script>
    <!-- Sprint 0.5: Connection Health Monitoring -->
    {% include 'tv_games/_debug_panel.html' %}
</body>
</html>
