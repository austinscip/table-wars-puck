<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 [GAME NAME] 3D - Game [XX]</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/postprocessing/ShaderPass.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            color: white;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* TODO: Copy your HUD from original 2D game here */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 50px;
            font-size: 28px;
            z-index: 10;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #00ff00;
        }

        .hud-value {
            color: #00ff00;
            font-size: 36px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- TODO: Copy HUD HTML from your original 2D game -->
    <div id="hud">
        <div class="hud-item">
            <div>SCORE</div>
            <div class="hud-value" id="score">0</div>
        </div>
    </div>

    <script>
        const PUCK_ID = {{ puck_id }};

        // ====================================================================
        // STEP 1: THREE.JS SETUP (COPY 100% FROM puck_racer_3d.html)
        // ====================================================================

        let scene, camera, renderer, composer;
        let gameObjects = [];  // Store your game-specific 3D objects
        let gameState = null;

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Post-processing (Bloom)
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,  // strength
                0.4,  // radius
                0.85  // threshold
            );
            composer.addPass(bloomPass);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Window resize
            window.addEventListener('resize', onWindowResize);

            // TODO: Call your game-specific scene setup
            createGameScene();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ====================================================================
        // STEP 2: CREATE YOUR GAME SCENE (WRITE THIS PART)
        // ====================================================================

        function createGameScene() {
            // TODO: Add your game-specific 3D objects here
            // Examples:
            // - Racing game: create road, lane markers
            // - Pong: create paddles, ball
            // - Space Invaders: create player ship, enemy grid
            // - Golf: create terrain, hole, ball

            // Example: Create a ground plane
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Example: Create a player object
            const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
            const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            const player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.y = 0.5;
            player.castShadow = true;
            scene.add(player);
            gameObjects.push(player);
        }

        // ====================================================================
        // STEP 3: WEBSOCKET (COPY 100% FROM YOUR ORIGINAL 2D GAME)
        // ====================================================================

        const socket = io();

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            socket.emit('join_game_room', { puck_id: PUCK_ID });
            socket.emit('request_game_state', { puck_id: PUCK_ID });
        });

        socket.on('game_state_update', (state) => {
            gameState = state;
            updateHUD(state);
            updateScene(state);  // This is where the magic happens!
        });

        socket.on('game_over', (data) => {
            // TODO: Show game over screen
            console.log('Game Over:', data);
        });

        // ====================================================================
        // STEP 4: UPDATE HUD (COPY 100% FROM YOUR ORIGINAL 2D GAME)
        // ====================================================================

        function updateHUD(state) {
            // TODO: Copy from your original 2D game
            document.getElementById('score').textContent = state.score || 0;

            // Update other HUD elements based on your game state
        }

        // ====================================================================
        // STEP 5: UPDATE 3D SCENE (WRITE THIS - MAP STATE TO 3D)
        // ====================================================================

        function updateScene(state) {
            // TODO: This is the ONLY part you need to customize per game
            // Map your game state variables to 3D object positions

            // Example for racing game:
            // const targetX = -6 + ((state.car_lane - 1) * 3);
            // playerCar.position.x = targetX;

            // Example for Pong:
            // paddle.position.y = state.paddle_y * 0.1;
            // ball.position.set(state.ball_x * 0.1, state.ball_y * 0.1, 0);

            // Example for Space Invaders:
            // playerShip.position.x = state.player_x * 0.1;
            // updateEnemies(state.enemies);

            // YOUR CODE HERE:
            if (gameObjects[0]) {
                // Example: Move first game object based on state
                // gameObjects[0].position.x = state.x || 0;
                // gameObjects[0].position.z = state.y || 0;
            }
        }

        // ====================================================================
        // STEP 6: RENDER LOOP (COPY 100%)
        // ====================================================================

        function animate() {
            requestAnimationFrame(animate);

            // Optional: Add rotation/animation to game objects
            gameObjects.forEach(obj => {
                // obj.rotation.y += 0.01;  // Example rotation
            });

            // Render with post-processing
            composer.render();
        }

        // ====================================================================
        // INIT
        // ====================================================================

        initThreeJS();
        animate();

        console.log('🎮 3D Game initialized - waiting for game state...');
    </script>
</body>
</html>
