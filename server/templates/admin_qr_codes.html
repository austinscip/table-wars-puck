<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Codes — {{ bar.name }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #F8FAFC;
      color: #0A0E1A;
      padding: 24px;
    }
    h1 { margin-bottom: 8px; }
    .sub { color: #475569; margin-bottom: 24px; }
    .toolbar {
      margin-bottom: 24px;
      display: flex; gap: 12px;
    }
    button {
      background: #0A0E1A;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #1E293B; }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .qr-card {
      background: white;
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      page-break-inside: avoid;
    }
    .qr-card h3 {
      margin-bottom: 12px;
      font-size: 1.3rem;
    }
    .qr-card img {
      width: 100%;
      max-width: 240px;
      height: auto;
      margin-bottom: 12px;
      background: white;
    }
    .qr-card .url {
      font-family: monospace;
      font-size: 0.75rem;
      color: #64748B;
      word-break: break-all;
    }
    .empty { color: #94A3B8; font-style: italic; }
    @media print {
      body { background: white; padding: 0; }
      .toolbar { display: none; }
      h1, .sub { margin-bottom: 12px; }
      .qr-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <h1>QR Codes — {{ bar.name }}</h1>
  <p class="sub">One per table · scan to join · {{ bar.total_tables }} total</p>

  <div class="toolbar">
    <button onclick="window.print()">Print all</button>
    <button onclick="location.reload()">Refresh</button>
  </div>

  <div class="qr-grid" id="qr-grid">
    <p class="empty">Generating…</p>
  </div>

  <script>
    const BAR_SLUG = "{{ bar.slug }}";
    const TOTAL = {{ bar.total_tables }};
    const grid = document.getElementById('qr-grid');

    async function render() {
      grid.innerHTML = '';
      for (let i = 1; i <= TOTAL; i++) {
        try {
          const r = await fetch(`/api/qr/${BAR_SLUG}/${i}`);
          const data = await r.json();
          const card = document.createElement('div');
          card.className = 'qr-card';
          card.innerHTML = `
            <h3>Table ${i}</h3>
            <img src="${data.qr_code || ''}" alt="QR Table ${i}" />
            <div class="url">${data.url || ''}</div>
          `;
          grid.appendChild(card);
        } catch (e) {
          const card = document.createElement('div');
          card.className = 'qr-card';
          card.innerHTML = `<h3>Table ${i}</h3><p class="empty">QR failed: ${e.message}</p>`;
          grid.appendChild(card);
        }
      }
    }
    render();
  </script>
</body>
</html>
