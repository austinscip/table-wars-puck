[mypy]
# Scoped to the runtime + games (the typed, actively-maintained core).
# The legacy Flask app isn't type-checked yet — that's a separate sweep.
files = runtime, games
ignore_missing_imports = True
# Pragmatic, not strict: catch real type errors without demanding full
# annotations on every legacy-adjacent helper.
warn_unused_ignores = True
warn_redundant_casts = True
