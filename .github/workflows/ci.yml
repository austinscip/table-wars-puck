name: CI

on:
  push:
    branches: [main, sandbox]
  pull_request:

jobs:
  runtime-tests:
    name: Runtime pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Postgres client+server binaries (for the RLS suite)
        # test_rls.py bootstraps a throwaway cluster via initdb/pg_ctl; on
        # GitHub's ubuntu image these ship preinstalled under
        # /usr/lib/postgresql/*/bin (the test finds them there). If absent
        # the RLS tests skip rather than fail.
        run: sudo apt-get update && sudo apt-get install -y postgresql || true

      - name: Install test deps
        # Runtime + games are pure stdlib, but the auth/redis/RLS/route
        # suites need these. fakeredis avoids a live Redis service.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10" "PyJWT>=2.8.0" \
            "fakeredis>=2.20.0" "flask>=3.0.0" "psycopg[binary]>=3.1.0" mypy

      - name: Type-check runtime + games (mypy)
        working-directory: server
        run: python -m mypy

      - name: Run runtime test suite
        working-directory: server
        run: python -m pytest -ra

  tv-tests:
    name: TV typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: TableWarsTV/package-lock.json

      - name: Install deps
        working-directory: TableWarsTV
        run: npm ci

      # config.ts is gitignored (per-venue Supabase/runtime values); the
      # checked-in example carries safe placeholders and exports the same
      # symbols, so it's a valid drop-in for typecheck/lint/test.
      - name: Generate config from example
        working-directory: TableWarsTV
        run: cp src/config.example.ts src/config.ts

      - name: Typecheck
        working-directory: TableWarsTV
        run: npx tsc --noEmit

      - name: Lint
        working-directory: TableWarsTV
        run: npx eslint .

      - name: Unit tests (lib)
        working-directory: TableWarsTV
        # Scoped to src/lib: App.test.tsx fails on a pre-existing
        # @react-navigation jest transform issue, tracked separately.
        run: npx jest src/lib

  firmware-tests:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure host-side unit tests for src/hal/sp_json.h (the puck's JSON
      # parsers) via a minimal Arduino String shim — no ESP32 toolchain.
      - name: sp_json parser tests
        run: ./testing/firmware/run.sh
