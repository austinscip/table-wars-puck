; PlatformIO Project Configuration File - UPGRADED
;
; Includes all libraries needed for the new features:
; - OTA Updates
; - Dual-Core
; - Capacitive Touch
; - ESP-NOW
; - I2S Audio (optional)
; - Bluetooth A2DP (optional)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Build flags
build_flags =
    -D PUCK_ID=1
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D SERVER_URL=\"http://192.168.1.100:5001\"

; Required libraries
lib_deps =
    ; Core dependencies
    fastled/FastLED@^3.6.0
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.0

    ; ESP-NOW (built-in, no library needed)

    ; OTA Updates (built-in, no library needed)

    ; Optional: I2S Audio (uncomment if using I2S speaker)
    ; pschatzmann/ESP32-audioI2S@^0.9.0

    ; Optional: Bluetooth A2DP (uncomment if using Bluetooth audio)
    ; pschatzmann/ESP32-A2DP@^1.8.0

    ; Optional: SD Card (built-in, no library needed)

    ; Optional: Camera (uncomment if using ESP32-CAM)
    ; espressif/esp32-camera@^2.0.0

[env:esp32_ota]
; Environment for OTA (wireless) uploads
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = TableWarsPuck.local  ; or use IP address like 192.168.1.100
upload_flags =
    --port=3232
    --auth=puck2024

monitor_speed = 115200

build_flags =
    -D PUCK_ID=1
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D SERVER_URL=\"http://192.168.1.100:5001\"

lib_deps =
    fastled/FastLED@^3.6.0
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.0

; ============================================================================
; SPEED PYRAMID v1 (Sprint 1 firmware)
; ============================================================================
; Standalone build that uses src/firmware/sp_main.cpp instead of src/main.cpp.
; Pulls in src/hal/sp_*.h + src/games/g_speed_pyramid.h. Defaults to Rev A
; pins (BUTTON=27, BUZZER=15, LED=23, MOTOR=13, SDA=21, SCL=22). For Rev B
; pucks, add -D PUCK_REV_B to build_flags.

[env:puck1_speed_pyramid]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    -<*>
    +<firmware/sp_main.cpp>

build_flags =
    -D PUCK_ID=1
    -D PUCK_REV_B
    -D SPEED_PYRAMID_SERVER_URL=\"http://192.168.1.67:5001\"
    -D SPEED_PYRAMID_WIFI_SSID=\"ATT2UJj3HT\"
    -D SPEED_PYRAMID_WIFI_PASS=\"9dmg67p8ydq4\"

[env:puck2_speed_pyramid]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    -<*>
    +<firmware/sp_main.cpp>

build_flags =
    -D PUCK_ID=2
    -D PUCK_REV_B
    -D SPEED_PYRAMID_SERVER_URL=\"http://192.168.1.67:5001\"
    -D SPEED_PYRAMID_WIFI_SSID=\"ATT2UJj3HT\"
    -D SPEED_PYRAMID_WIFI_PASS=\"9dmg67p8ydq4\"

# Sandbox / dev envs — same hardware, point at sandbox Flask on :5002
# instead of the bar's :5001. Flash these onto Austin's desk pucks so
# bar pucks (production envs above) are never disturbed by in-progress
# work.
[env:puck1_dev_speed_pyramid]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    -<*>
    +<firmware/sp_main.cpp>

build_flags =
    -D PUCK_ID=1
    -D PUCK_REV_B
    -D SPEED_PYRAMID_SERVER_URL=\"http://192.168.1.67:5002\"
    -D SPEED_PYRAMID_WIFI_SSID=\"ATT2UJj3HT\"
    -D SPEED_PYRAMID_WIFI_PASS=\"9dmg67p8ydq4\"

lib_deps =
    fastled/FastLED@^3.6.0
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

[env:puck2_dev_speed_pyramid]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    -<*>
    +<firmware/sp_main.cpp>

build_flags =
    -D PUCK_ID=2
    -D PUCK_REV_B
    -D SPEED_PYRAMID_SERVER_URL=\"http://192.168.1.67:5002\"
    -D SPEED_PYRAMID_WIFI_SSID=\"ATT2UJj3HT\"
    -D SPEED_PYRAMID_WIFI_PASS=\"9dmg67p8ydq4\"

lib_deps =
    fastled/FastLED@^3.6.0
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

[env:puck1]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D PUCK_ID=1

[env:puck2]
